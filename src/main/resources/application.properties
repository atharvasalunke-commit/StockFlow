spring.application.name=stockflow

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/stockflow?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USER:admin}
spring.datasource.password=${MYSQL_PASSWORD:stockflow123}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

stockflow.security.jwt.secret=${JWT_SECRET}
stockflow.security.jwt.access-token-ttl=1h
stockflow.security.jwt.issuer=stockflow

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
